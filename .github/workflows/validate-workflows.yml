name: Validate Workflows

# Ce repo n'avait aucune CI, alors que ses quatre `workflow_call` sont consommés en `@main`
# par les cinq autres : une erreur de contrat n'y était pas visible au moment de la relecture,
# elle cassait le déploiement du premier repo qui appelait `@main`.
#
# Le protocole que `.claude/rules/lessons.md` imposait à la main tourne donc ici :
# `actionlint`, puis un appelant committé qui référence les workflows en chemin local, puis un
# appelant fautif dont on **vérifie les erreurs une par une**. Les deux appelants vivent dans
# `.github/workflow-tests/`, dossier que GitHub ne lit jamais.
#
# `actionlint` résout les `uses: ./…` depuis la racine du dépôt **git** : le checkout est donc
# nécessaire, et un lint lancé hors d'un dépôt ne vérifierait aucun contrat tout en sortant 0.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pas de filtre `paths` : le job coûte quelques secondes, et un filtre laisserait le check
# éternellement `pending` sur les PR qui ne touchent pas `.github/`, ce qui interdirait de le
# rendre obligatoire à la fusion.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  # L'id de ce job est le nom du check exigé par le ruleset de `main` (website#65) : le
  # renommer ne casse rien ici, mais le check attendu ne se rapporterait plus jamais et
  # toute pull request resterait bloquée en attente. Changer les deux ensemble.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Les appelants de test ne sont inertes que parce qu'ils sont hors de
      # `.github/workflows/`. Déplacé là, l'appelant *valide* linterait proprement et
      # deviendrait un workflow réel, qui pousse un tag puis une image. On refuse donc le
      # déplacement explicitement, plutôt que de confier l'invariante à un commentaire.
      - name: Les appelants de test restent hors du dossier exécuté
        run: |
          if compgen -G '.github/workflows/*-caller.*' > /dev/null; then
            echo "::error::Un appelant de test est dans .github/workflows/ : il y deviendrait exécutable."
            exit 1
          fi

      # Version épinglée : une montée d'actionlint peut ajouter des règles, et doit donc être
      # volontaire. Le script est téléchargé puis exécuté en deux temps, avec `--retry`, pour
      # qu'un hoquet réseau échoue franchement — `bash <(curl …)` sort 0 sur un 404, vérifié.
      - name: Install actionlint
        run: |
          curl -sSfL --retry 3 --retry-all-errors \
            -o /tmp/download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash /tmp/download-actionlint.bash "$ACTIONLINT_VERSION"
          ./actionlint -version

      # Sans argument, actionlint scanne `.github/workflows/` — y compris un futur `.yaml`,
      # qu'un glob `*.yml` laisserait passer — et ne touche pas à `.github/workflow-tests/`.
      - name: Lint des workflows
        run: ./actionlint -color

      - name: Contrat des workflow_call — l'appelant valide doit passer
        run: ./actionlint -color .github/workflow-tests/valid-caller.yml

      # Ce step garantit la valeur des deux précédents : un lint qui ne résoudrait plus les
      # chemins locaux sort 0 sur n'importe quoi. Il ne suffit donc pas d'exiger un code non
      # nul — un fautif renommé, vidé ou au YAML cassé en produirait un aussi, et le step
      # passerait en affichant « 0 erreur ». On vérifie le compte **et** chaque message.
      - name: Contrat des workflow_call — l'appelant fautif doit échouer
        env:
          INVALID_CALLER: .github/workflow-tests/invalid-caller.yml
          EXPECTED_ERRORS: '9'
        run: |
          test -f "$INVALID_CALLER" || { echo "::error::$INVALID_CALLER est absent : le contrôle de contrat n'a plus de témoin."; exit 1; }

          if ./actionlint "$INVALID_CALLER" > /tmp/invalid-caller.log 2>&1; then
            echo "::error::L'appelant fautif est passé : le contrôle de contrat ne mord plus."
            exit 1
          fi

          n=$(grep -cE '^\.github' /tmp/invalid-caller.log)
          if [ "$n" -ne "$EXPECTED_ERRORS" ]; then
            echo "::error::$n erreur(s) relevée(s) au lieu de $EXPECTED_ERRORS attendue(s)."
            echo "Si c'est voulu, ajuster EXPECTED_ERRORS ; sinon, le contrôle a perdu de sa portée."
            cat /tmp/invalid-caller.log
            exit 1
          fi

          # Une catégorie par assertion : un code non nul ne dit pas *laquelle* mord encore.
          for expected in \
            'input "version" is required' \
            'input "image-description" is required' \
            'input "image-title" is required' \
            'input "image-titel" is not defined' \
            'input "sauter-la-ci" is not defined' \
            'secret "CODECOV_TOKENN" is not defined' \
            'secret "SSH_PRIVATE_KEY" is required' \
            'property "image-version" is not defined' \
            'missing input "token" which is required by action'
          do
            grep -qF "$expected" /tmp/invalid-caller.log || {
              echo "::error::Catégorie non détectée : $expected"
              cat /tmp/invalid-caller.log
              exit 1
            }
          done

          echo "✅ Les $n erreurs attendues sont toutes relevées, une par catégorie :"
          cat /tmp/invalid-caller.log
